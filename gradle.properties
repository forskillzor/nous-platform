org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.workers.max=4
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx256M

# Compose Hot Reload отключён (bundled plugin, CMP 1.10+): не нужен, а на живом
# процессе после пересборки классов давал NoClassDefFoundError по лямбда/локальным классам
org.jetbrains.compose.hot.reload.disable=true
